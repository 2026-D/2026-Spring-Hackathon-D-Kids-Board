{% extends 'kids_board/base.html' %}

{% load django_bootstrap5 %}
{% load static %}

{% block title %}Top{% endblock %}

{% block extra_css %}
<style>
    /*カルーセルのスタイル*/
    .top-carousel {
        width: 100%;
        margin: 0 auto;
    }
    .top-carousel .carousel-item img {
        width: 80%;
        height: 80%;
        object-fit: contain;
        margin: 0 auto;
    }
    @media (min-width: 768px) {
        .top-carousel {
            width: 70%;
        }
    }
    /*始めるのボタン表示（PC)の位置を調整*/
    @media (min-width: 992px) {
    .pc-only-padding {
        padding: 0 0 0 40rem;
        }
    }
</style> 
{% endblock %}
{% block content %}
<div style="height: 30px;"><!-- カルーセル・調整用div --></div>
<!-- カルーセル -->
<div id="carouselExampleAutoplaying" class="carousel slide top-carousel" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="{% static 'images/top/top1.png' %}" class="d-block" alt="トップ画像1">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/top/top2.png' %}" class="d-block" alt="トップ画像2">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/top/top3.png' %}" class="d-block" alt="トップ画像3">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
<div class="pc-only-padding d-none d-md-flex flex-row justify-content-center align-items-center mt-md-5">
    <button type="button" class="btn btn-outline-primary btn-lg d-block mx-auto" onclick="location.href='{% url 'signup' %}'">はじめる</button>
</div>  
{% endblock %}

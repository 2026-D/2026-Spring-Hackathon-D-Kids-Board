{% load static %}

<!-- ================= こども新規追加モーダル ================= -->
<div class="modal fade" id="addChildModal" tabindex="-1" aria-labelledby="addChildModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <form method="post" action="{% url 'child_create' %}">
                {% csrf_token %}

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addChildModalLabel">こどもの追加</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <!-- 名前入力 -->
                    <div class="mb-3">
                        <label for="addChildNameInput" class="form-label">名前</label>
                        <input
                            type="text"
                            class="form-control"
                            id="addChildNameInput"
                            name="child_name"
                            value="{{ form.child_name.value|default:'' }}" {% comment %}入力後にモーダルが閉じず、入力値が残るようにするため追記{% endcomment %}
                            required
                        >
                        {% comment %}こどもの名前が同名の場合のエラーメッセージ表示{% endcomment %}
                        {% if form.child_name.errors %}
                        <div class="text-danger mt-1">
                            {{ form.child_name.errors.0 }}
                        </div>
                        {% endif %}
                    </div>
                    
                    

                    <!-- アイコン選択 -->
                    <div class="mb-3">
                        <label class="form-label">アイコン選択</label>
                    </div>

                    <input

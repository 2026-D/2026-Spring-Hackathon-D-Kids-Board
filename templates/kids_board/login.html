{% extends 'kids_board/base.html' %}

{% load django_bootstrap5 %}
{% load static %}

{% block title %}Kids Board{% endblock %}

{% block extra_css %}
<style>
    .form-control {
        width: 320px;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<!--<div class="login-container">-->    
    <div class="container mt-5 d-flex flex-column justify-content-center align-items-center">
        <h2 class="text-center mb-4">ログイン</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">ログイン</button>
        </form>
        <p class="mt-3 text-center" style="color: var(--gray-700);"> 
            アカウントがありませんか？
            <a href="{% url 'signup' %}">アカウント作成へ</a>             
        </p>
    </div>
</div>
{% endblock %}
